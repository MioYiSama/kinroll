name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.2" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;4.1.2"
      - name: Build APK
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: brew install xcodegen
      - name: Build unsigned IPA
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
