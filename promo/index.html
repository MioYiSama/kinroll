<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Kinroll promo</title>
<style>
  :root {
    --navy: #2E3A59; --blue: #9CC3E6; --amber: #F5B942; --cream: #F6F1EA;
    --ui: #3A6EA5; --red: #FF5D5D; --ink: #0E1220;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; }
  .center { left: 0; right: 0; text-align: center; }
  .c { display: inline-block; white-space: pre; }

  /* ---------- pain ---------- */
  #pain { background: var(--ink); }
  #wall { position: absolute; left: 14px; top: 0; width: 1052px; }
  #wallShade { background: radial-gradient(ellipse 80% 55% at 50% 50%, rgba(14,18,32,.55), rgba(14,18,32,.92)); }
  .tile { position: absolute; border-radius: 22px; overflow: hidden; }
  .tile .sun { position: absolute; border-radius: 50%; background: #FFE08A; }
  .tile .mtn { position: absolute; left: 0; right: 0; bottom: 0; height: 55%; background: rgba(0,0,0,.28); clip-path: polygon(0 60%, 22% 15%, 40% 50%, 62% 5%, 85% 45%, 100% 25%, 100% 100%, 0 100%); }
  .tile .bar { position: absolute; left: 10%; height: 6%; border-radius: 99px; background: #D9DCE4; }
  .tile .bubble { position: absolute; right: 10%; height: 13%; width: 48%; border-radius: 14px; background: #95EC69; }
  .pain-text { color: #fff; font-weight: 600; text-shadow: 0 6px 30px rgba(0,0,0,.5); }
  .red { color: var(--red); }

  #notif { left: 60px; width: 960px; top: 150px; padding: 34px 38px; border-radius: 40px; background: rgba(245,246,250,.94); box-shadow: 0 30px 80px rgba(0,0,0,.45); display: flex; gap: 30px; align-items: center; }
  #notif .ic { width: 110px; height: 110px; border-radius: 26px; background: linear-gradient(135deg,#FF7A6B,#FF3D57); flex: none; display: grid; place-items: center; }
  #notif .t1 { font-size: 44px; font-weight: 600; color: #111; }
  #notif .t2 { font-size: 34px; color: #555; margin-top: 6px; }
  #notif .track { margin-top: 18px; height: 16px; border-radius: 99px; background: #DADCE3; overflow: hidden; }
  #notif .fill { height: 100%; background: var(--red); border-radius: 99px; }

  .stamp { position: absolute; left: 50%; top: 50%; padding: 8px 26px; border: 7px solid var(--red); border-radius: 18px; color: var(--red); background: rgba(255,255,255,.88); font-size: 56px; font-weight: 600; white-space: nowrap; }
  .pill { display: inline-block; padding: 6px 34px; border-radius: 99px; background: var(--red); color: #fff; }

  /* ---------- brand ---------- */
  #brand { background: var(--cream); }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
  .navy { color: var(--navy); }

  #phone { position: absolute; left: 221px; top: 462px; width: 638px; height: 1397px; padding: 14px; border-radius: 64px; background: #10131C; box-shadow: 0 50px 120px rgba(46,58,89,.35), inset 0 0 0 3px #2A2F3D; }
  #screen { position: relative; width: 610px; height: 1369px; border-radius: 52px; overflow: hidden; background: #FAF9FF; }
  .shot { position: absolute; left: 0; top: 0; width: 540px; height: 1212px; transform-origin: 0 0; }
  .shot > img { position: absolute; left: 0; top: 0; width: 540px; height: 1212px; }
  .ov { position: absolute; }
  .ring { position: absolute; border: 4px solid var(--amber); border-radius: 14px; box-shadow: 0 0 0 6px rgba(245,185,66,.25); }
  .tap { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; background: rgba(46,58,89,.25); border: 4px solid rgba(255,255,255,.9); }
  .toast { position: absolute; left: 50%; padding: 14px 28px; border-radius: 99px; background: #2E3A59; color: #fff; font-size: 24px; font-weight: 600; white-space: nowrap; }

  #feat-head { top: 120px; }
  .chip { display: inline-block; padding: 8px 26px; border-radius: 99px; background: var(--navy); color: var(--amber); font-size: 34px; font-weight: 600; letter-spacing: 2px; }
  .head { font-size: 118px; font-weight: 600; color: var(--navy); line-height: 1.2; margin-top: 18px; }
  .hl { background: linear-gradient(transparent 62%, rgba(245,185,66,.75) 62%, rgba(245,185,66,.75) 92%, transparent 92%); background-repeat: no-repeat; }
  .sub { font-size: 44px; color: #5A6480; margin-top: 10px; }
  .feat { position: absolute; left: 0; right: 0; text-align: center; }

  .badge { position: absolute; display: flex; align-items: center; gap: 16px; padding: 22px 34px; border-radius: 30px; background: #fff; box-shadow: 0 20px 60px rgba(46,58,89,.25); font-size: 40px; font-weight: 600; color: var(--navy); white-space: nowrap; }
  .badge.amber { background: var(--amber); }

  #flash { background: #fff; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">

  <!-- ===================== PAIN ===================== -->
  <div id="pain" class="layer">
    <div id="wall"></div>
    <div id="wallShade" class="layer"></div>

    <!-- full -->
    <div id="s-full" class="layer">
      <div id="notif" class="abs">
        <div class="ic"><svg width="62" height="62" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></div>
        <div style="flex:1">
          <div class="t1">存储空间已满</div>
          <div class="t2">照片 <span id="cnt">38,216</span> 张 · 无法拍摄新照片</div>

        </div>
      </div>

      <div class="abs center pain-text red" style="top:900px;font-size:165px;line-height:1.1" id="full2">又又又满了！</div>
    </div>

    <!-- junk -->
    <div id="s-junk" class="layer">

        <span class="w">截图</span><span class="w" style="opacity:.5"> · </span><span class="w">重复</span><span class="w" style="opacity:.5"> · </span><span class="w">废片</span>
      </div>
      <div id="junkGrid" class="abs" style="left:74px;top:540px;width:932px;height:932px"></div>
      <div class="abs center pain-text" style="top:1560px;font-size:130px" id="junkEnd"><span class="pill">删都删不完</span></div>
    </div>

    <!-- search -->
    <div id="s-search" class="layer">
      <div class="abs center" style="top:330px"><span class="chip" style="background:rgba(255,255,255,.12);color:#fff;font-size:40px" id="scroll-chip">已翻 <span id="scnt">0</span> 张</span></div>
      <div class="abs center pain-text" style="top:760px;font-size:130px" id="srch1">想找张发票</div>
      <div class="abs center pain-text red" style="top:960px;font-size:150px" id="srch2">翻到手指发酸</div>
      <div class="tap" id="finger" style="left:780px;background:rgba(255,255,255,.18);width:120px;height:120px;margin:-60px 0 0 -60px"></div>
    </div>

    <!-- cloud -->
    <div id="s-cloud" class="layer">
      <svg id="cloud" class="abs" style="left:290px;top:250px" width="500" height="320" viewBox="0 0 500 320">
        <path id="cloudPath" d="M120 300 C50 300 10 250 20 195 C30 140 85 115 130 125 C145 60 210 20 280 35 C345 50 380 100 382 150 C440 145 490 190 485 240 C480 285 440 300 400 300 Z" fill="#E8ECF5"/>
        <text x="250" y="230" text-anchor="middle" font-size="76" font-weight="600" fill="#2E3A59" font-family="PingFang SC">AI</text>
      </svg>
      <div id="flyers" class="layer"></div>
      <div class="abs center pain-text" style="top:1060px;font-size:110px" id="cl1">交给云端 AI？</div>
      <div class="abs center pain-text red" style="top:1250px;font-size:150px" id="cl2">隐私谁来管？</div>
      <svg id="warn" class="abs" style="left:700px;top:200px" width="150" height="150" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#FF5D5D"/><path d="M12 6v8M12 17.5v.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
    </div>
  </div>

  <!-- ===================== BRAND ===================== -->
  <div id="brand" class="layer">
    <div class="blob" id="blob1" style="width:700px;height:700px;background:#9CC3E6;left:-200px;top:-150px"></div>
    <div class="blob" id="blob2" style="width:640px;height:640px;background:#F5B942;right:-220px;bottom:-100px;opacity:.35"></div>

    <!-- logo / end -->
    <div id="s-logo" class="layer">
      <svg id="logo" class="abs" style="left:300px;top:430px" width="480" height="480" viewBox="232 262 560 500">
        <defs><clipPath id="ov"><rect id="lgClip" x="232" y="262" width="380" height="380" rx="80"/></clipPath></defs>
        <rect id="lgNavy" x="232" y="262" width="380" height="380" rx="80" fill="#2E3A59"/>
        <g id="lgBlueG"><rect x="412" y="382" width="380" height="380" rx="80" fill="#9CC3E6"/></g>
        <g clip-path="url(#ov)"><g id="lgAmberG"><rect x="412" y="382" width="380" height="380" rx="80" fill="#F5B942"/></g></g>
      </svg>
      <div class="abs center navy" id="word" style="top:960px;font-size:210px;font-weight:600;letter-spacing:20px;padding-left:20px">相知</div>
      <div class="abs center navy" id="tag" style="top:1250px;font-size:70px;font-weight:600">完全<span class="hl" id="tagHl">离线</span>的 AI 相册</div>
      <div class="abs center" id="kin" style="top:1380px;font-size:40px;letter-spacing:14px;color:#8A93AA">KINROLL</div>
      <div class="abs center" id="plat" style="top:1490px">
        <span class="badge" style="position:static;display:inline-flex;font-size:38px;padding:16px 36px;margin:0 12px">Android</span>
        <span class="badge" style="position:static;display:inline-flex;font-size:38px;padding:16px 36px;margin:0 12px">iOS</span>
      </div>
    </div>

    <!-- features -->
    <div id="s-feat" class="layer">
      <div id="feat-head" class="abs center"></div>
      <div id="phone">
        <div id="screen">
          <div class="shot" id="sc-cleanup">
            <img src="../assets/screenshots/zh-cleanup.jpg">
            <div class="ring" id="tabRing" style="top:126px;height:46px"></div>
            <div id="gone"></div>
            <div class="tap" id="tap1" style="left:416px;top:1131px"></div>
            <div class="toast" id="toast1" style="top:960px">已移到回收站 · 释放空间</div>
          </div>
          <div class="shot" id="sc-overview">
            <img src="../assets/screenshots/zh-overview.jpg">
            <div class="ov" style="left:82px;top:128px;width:420px;height:50px;background:#E5E8ED"></div>
            <div class="ov" id="typed" style="left:90px;top:132px;font-size:30px;line-height:42px;color:#1B1B1F"></div>
            <div class="ov" id="caret" style="left:90px;top:136px;width:3px;height:34px;background:#3A6EA5"></div>
            <div id="dims"></div>
          </div>
          <div class="shot" id="sc-post">
            <img src="../assets/screenshots/zh-post.jpg">
            <div id="covers"></div>
            <div class="tap" id="tap3" style="left:270px;top:594px"></div>
          </div>
          <div class="shot" id="sc-home">
            <img src="../assets/screenshots/zh-home.jpg">
          </div>
        </div>
      </div>
      <div class="badge amber" id="bdg1" style="left:50px;top:860px">
        <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#2E3A59" stroke-width="2.2" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 4-2.4M10 5a15 15 0 0 1 12 3.5M5 12a10 10 0 0 1 3.2-2M13.5 9.3A10 10 0 0 1 19 12M8.5 15.5a5 5 0 0 1 6 0M12 19h.01M3 3l18 18"/></svg>
        断网也能用
      </div>
      <div class="badge" id="bdg2" style="right:40px;top:1320px">
        <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#2E3A59" stroke-width="2.2" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M8.5 12l2.5 2.5 4.5-5" stroke-linecap="round"/></svg>
        照片零上传
      </div>
      <div class="badge" id="bdg3" style="left:60px;top:1640px">
        <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#2E3A59" stroke-width="2.2"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 7h6M9 11h6M9 15h3" stroke-linecap="round"/></svg>
        AI 本地运行
      </div>
    </div>
  </div>

  <div id="flash" class="layer"></div>
</div>

<script>
// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eIn = (x) => x * x * x;
const eIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eBack = (x) => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const $ = (id) => document.getElementById(id);
const css = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const show = (el, on) => { el.style.display = on ? "" : "none"; };
// pop-in: returns [opacity, scale]
const pop = (u, at, d = 0.32) => { const x = p(u, at, at + d); return [clamp(x * 3), 0.4 + 0.6 * eBack(x)]; };
const popEl = (el, u, at, d, extra = "") => { const [o, s] = pop(u, at, d); css(el, { opacity: o, transform: `${extra} scale(${s})` }); };
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// ---------- tiles ----------
const PAL = [["#87B8E0", "#F1D6A6"], ["#F6A96B", "#6A4C93"], ["#2B4162", "#F9D56E"], ["#7FC8A9", "#3E8E7E"], ["#FFD6E0", "#FF8FAB"], ["#415A77", "#1B263B"], ["#A1C4FD", "#C2E9FB"], ["#F8B195", "#C06C84"]];
function tile(kind, size, pal) {
  const d = document.createElement("div");
  d.className = "tile";
  css(d, { width: size + "px", height: size + "px" });
  if (kind === "photo" || kind === "blur") {
    const [a, b] = PAL[pal % PAL.length];
    const inner = document.createElement("div");
    inner.className = "layer";
    inner.style.background = `linear-gradient(180deg, ${a}, ${b})`;
    inner.innerHTML = `<div class="sun" style="width:${size * .22}px;height:${size * .22}px;left:${size * (.15 + (pal % 3) * .22)}px;top:${size * .14}px"></div><div class="mtn"></div>`;
    if (kind === "blur") css(inner, { filter: `blur(${size / 28}px)`, transform: "scale(1.1)" });
    d.appendChild(inner);
  } else if (kind === "cat") {
    const s = size / 133;
    css(d, { backgroundImage: "url(../assets/screenshots/zh-overview.jpg)", backgroundSize: `${540 * s}px ${1212 * s}px`, backgroundPosition: `0px ${-273 * s}px` });
  } else if (kind === "shot") {
    d.style.background = "#fff";
    let h = `<div class="bar" style="top:7%;width:25%;background:#222;height:4%"></div>`;
    for (let i = 0; i < 4; i++) h += `<div class="bar" style="top:${22 + i * 11}%;width:${45 + ((pal * 13 + i * 29) % 40)}%"></div>`;
    h += `<div class="bubble" style="top:72%"></div>`;
    d.innerHTML = h;
  } else if (kind === "receipt") {
    d.style.background = "#FBF6EC";
    let h = "";
    for (let i = 0; i < 6; i++) h += `<div class="bar" style="top:${12 + i * 13}%;width:${i === 5 ? 40 : 75}%;background:#D8CFBF"></div>`;
    d.innerHTML = h;
  }
  return d;
}

// wall: endless camera roll
const WALL_COLS = 5, WALL_ROWS = 44, WT = 204, WG = 8;
{
  const wall = $("wall");
  const kinds = ["photo", "photo", "shot", "blur", "photo", "cat", "receipt", "shot", "photo", "blur"];
  for (let r = 0; r < WALL_ROWS; r++) for (let c = 0; c < WALL_COLS; c++) {
    const t = tile(kinds[Math.floor(rnd() * kinds.length)], WT, Math.floor(rnd() * 8));
    css(t, { left: c * (WT + WG) + "px", top: r * (WT + WG) + "px", borderRadius: "14px" });
    wall.appendChild(t);
  }
}

// junk grid 3x3 with stamps
const JUNK = [["shot", "截图"], ["photo", "重复", 2], ["blur", "废片", 0], ["photo", "重复", 2], ["shot", "截图"], ["cat", "重复"], ["blur", "废片", 3], ["cat", "重复"], ["shot", "截图"]];
const junkStamps = [];
JUNK.forEach(([k, label, pal], i) => {
  const t = tile(k, 300, pal ?? i);
  css(t, { left: (i % 3) * 316 + "px", top: Math.floor(i / 3) * 316 + "px" });
  const s = document.createElement("div");
  s.className = "stamp";
  s.textContent = label;
  t.appendChild(s);
  junkStamps.push({ el: s, label, tile: t });
  $("junkGrid").appendChild(t);
});

// cloud flyers
const flyers = [];
for (let i = 0; i < 7; i++) {
  const t = tile(["photo", "cat", "shot", "photo", "receipt", "photo", "cat"][i], 150, i + 1);
  t.style.boxShadow = "0 10px 30px rgba(0,0,0,.4)";
  $("flyers").appendChild(t);
  flyers.push({ el: t, x: 60 + (i * 137) % 900, y: 1650 + (i % 3) * 90, at: i * 0.11 });
}

// cleanup: selected cells that disappear
const GONE = [[136, 244], [136, 447], [271, 447], [407, 447]].map(([x, y]) => {
  const cover = document.createElement("div");
  cover.className = "ov";
  css(cover, { left: x + "px", top: y + "px", width: "134px", height: "133px", background: "#FAF9FF" });
  const cell = document.createElement("div");
  cell.className = "ov";
  css(cell, { left: x + "px", top: y + "px", width: "134px", height: "133px", backgroundImage: "url(../assets/screenshots/zh-cleanup.jpg)", backgroundSize: "540px 1212px", backgroundPosition: `${-x}px ${-y}px` });
  $("gone").append(cover, cell);
  return { cover, cell };
});
// overview: dim overlays per grid cell
const CELLS = [];
for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
  const d = document.createElement("div");
  d.className = "ov";
  css(d, { left: [0, 136, 271, 407][c] + "px", top: 273 + r * 136 + "px", width: (c === 3 ? 133 : 134) + "px", height: "134px" });
  $("dims").appendChild(d);
  CELLS.push(d);
}
// post: line covers for typewriter reveal
const COVERS = [];
for (let i = 0; i < 7; i++) {
  const d = document.createElement("div");
  d.className = "ov";
  css(d, { top: 668 + i * 31.5 + "px", height: "32px", background: "#F3F4F9", right: "26px" });
  $("covers").appendChild(d);
  COVERS.push(d);
}

// feature headlines
const FEATS = {
  cleanup: { chip: "01 · 智能清理", head: "一键清理", sub: "废片 · 截图 · 重复照片" },
  overview: { chip: "02 · 自然语言搜索", head: "一句话搜图", sub: "猫、发票、风景，秒找到" },
  post: { chip: "03 · 帖文生成", head: "帖文自动写好", sub: "小红书 · 朋友圈 · 微博 · Instagram" },
  offline: { chip: "04 · 完全离线", head: "照片不出手机", sub: "AI 模型全部在手机上运行" },
};
for (const [k, f] of Object.entries(FEATS)) {
  const d = document.createElement("div");
  d.className = "feat";
  d.id = "fh-" + k;
  d.innerHTML = `<span class="chip">${f.chip}</span><div class="head"><span class="hl">${[...f.head].map((c) => `<span class="c">${c}</span>`).join("")}</span></div><div class="sub">${f.sub}</div>`;
  $("feat-head").appendChild(d);
  f.el = d;
}
["full2", "srch2", "cl2", "word"].forEach((id) => { const el = $(id); el.innerHTML = [...el.textContent].map((c) => `<span class="c">${c}</span>`).join(""); });

// ---------- timeline ----------
let T = null, TOTAL = 0;
window.setTimeline = (tl) => {
  TOTAL = tl.total;
  T = {};
  tl.lines.forEach((l, i) => {
    const a = i === 0 ? 0 : l.start - 0.12;
    const next = tl.lines[i + 1];
    const b = next ? next.start - 0.12 : tl.total;
    T[l.scene] = { a, b, ls: l.start - a, le: l.end - a };
  });
};

const charsIn = (el, u, at, stagger = 0.045, d = 0.3) => {
  el.querySelectorAll(".c").forEach((c, i) => {
    const [o, s] = pop(u, at + i * stagger, d);
    css(c, { opacity: o, transform: `translateY(${(1 - clamp(s)) * 60}px) scale(${s})` });
  });
};
const shake = (u, at, d = 0.35, amp = 18) => { const x = p(u, at, at + d); return x <= 0 || x >= 1 ? 0 : Math.sin(x * 40) * amp * (1 - x); };

window.seek = (t) => {
  const S = T;
  const inS = (k) => t >= S[k].a && t < S[k].b;
  const painOn = t < S.logo.a;
  show($("pain"), painOn);
  show($("brand"), !painOn);

  // flash on the turn
  css($("flash"), { opacity: (1 - eOut(p(t, S.logo.a, S.logo.a + 0.35))) * (t >= S.logo.a ? 1 : 0) });

  if (painOn) {
    // pre-turn punch-in
    const pre = eIn(p(t, S.logo.a - 0.25, S.logo.a));
    css($("pain"), { transform: `scale(${1 + pre * 0.25})`, filter: `blur(${pre * 8}px)` });

    // wall: slow drift, then a frantic scroll during "search"
    const wy = -90 * t - 3800 * eIO(p(t, S.search.a, S.search.b - 0.2));
    const speed = S.search.a < t && t < S.search.b ? Math.sin(Math.PI * p(t, S.search.a, S.search.b - 0.2)) : 0;
    css($("wall"), { transform: `translateY(${wy}px)`, filter: `blur(${speed * 7}px)` });
    const wallOp = inS("full") ? 0.55 : inS("junk") ? 0.18 : inS("search") ? 1 : 0.3;
    css($("wall"), { opacity: wallOp });
    css($("wallShade"), { opacity: inS("search") ? 0.6 : 1 });

    for (const k of ["full", "junk", "search", "cloud"]) show($("s-" + k), inS(k));

    if (inS("full")) {
      const u = t - S.full.a, L = S.full;
      const n = eOut(p(u, 0.05, 0.5));
      css($("notif"), { transform: `translateY(${(1 - n) * -420}px)`, opacity: n });
      $("cnt").textContent = Math.round(38216 - 600 * (1 - eOut(p(u, 0.1, 1.6)))).toLocaleString("en-US");
      css($("fill"), { width: 70 + 29.5 * eOut(p(u, 0.2, 1.5)) + "%" });
      popEl($("full1"), u, L.ls + 0.0, 0.3);
      charsIn($("full2"), u, L.ls + 0.62, 0.11, 0.28);
      css($("full2"), { transform: `translateX(${shake(u, L.ls + 1.2, 0.4, 22)}px)` });
    }
    if (inS("junk")) {
      const u = t - S.junk.a, L = S.junk;
      const words = $("junkWords").querySelectorAll(".w");
      const wAt = [0.0, 0.3, 0.5, 0.85, 1.05];
      words.forEach((w, i) => popEl(w, u, L.ls + wAt[i], 0.28));
      const lAt = { 截图: 0.05, 重复: 0.5, 废片: 1.1 };
      junkStamps.forEach((s, i) => {
        const at = L.ls + lAt[s.label] + (i % 3) * 0.06;
        const x = p(u, at, at + 0.18);
        css(s.el, { opacity: x > 0 ? 1 : 0, transform: `translate(-50%,-50%) rotate(-12deg) scale(${2.2 - 1.2 * eOut(x)})` });
      });
      const g = eOut(p(u, 0, 0.35));
      css($("junkGrid"), { opacity: g, transform: `translateY(${(1 - g) * 120}px) translateX(${shake(u, L.ls + 2.2, 0.5, 16)}px)` });
      popEl($("junkEnd"), u, L.ls + 2.15, 0.3, `translateX(${shake(u, L.ls + 2.35, 0.5, 20)}px)`);
    }
    if (inS("search")) {
      const u = t - S.search.a, L = S.search;
      popEl($("srch1"), u, L.ls, 0.3);
      charsIn($("srch2"), u, L.ls + 0.95, 0.06, 0.26);
      $("scnt").textContent = Math.round(2431 * eIO(p(u, 0, S.search.b - S.search.a - 0.2))).toLocaleString("en-US");
      const f = (u * 2.6) % 1;
      css($("finger"), { top: 1500 - 600 * eOut(f) + "px", opacity: Math.sin(Math.PI * f) });
    }
    if (inS("cloud")) {
      const u = t - S.cloud.a, L = S.cloud;
      const hit = L.ls + 1.05;
      const red = p(u, hit, hit + 0.2);
      $("cloudPath").setAttribute("fill", red > 0 ? "#FFD2D2" : "#E8ECF5");
      const c = eOut(p(u, 0, 0.35));
      css($("cloud"), { opacity: c, transform: `translateY(${(1 - c) * -80}px) translateX(${shake(u, hit, 0.45, 18)}px)` });
      flyers.forEach((f) => {
        const x = eIO(p(u, 0.1 + f.at, 0.8 + f.at));
        css(f.el, { left: f.x + (465 - f.x) * x + "px", top: f.y + (330 - f.y) * x + "px", transform: `scale(${1 - 0.7 * x}) rotate(${(1 - x) * (f.at * 90 - 30)}deg)`, opacity: x >= 1 ? 0 : 1 });
      });
      popEl($("cl1"), u, L.ls, 0.3);
      charsIn($("cl2"), u, hit, 0.06, 0.26);
      popEl($("warn"), u, hit + 0.1, 0.3);
    }
    return;
  }

  // ---------- brand ----------
  const bt = t - S.logo.a;
  css($("blob1"), { transform: `translate(${Math.sin(bt * 0.6) * 80}px, ${Math.cos(bt * 0.5) * 60}px)` });
  css($("blob2"), { transform: `translate(${Math.cos(bt * 0.5) * 70}px, ${Math.sin(bt * 0.7) * 60}px)` });

  const logoOn = inS("logo") || t >= S.end.a;
  const featOn = t >= S.cleanup.a && t < S.end.a + 0.5;
  show($("s-logo"), logoOn);
  show($("s-feat"), featOn);
  
  if (logoOn) {
    const isEnd = t >= S.end.a;
    const L = isEnd ? S.end : S.logo;
    const u = t - L.a;
    const d0 = isEnd ? 0.3 : 0;
    // logo halves fly together; the amber overlap emerges where they meet
    const k = eBack(p(u, d0, d0 + 0.55));
    const nx = (1 - k) * -360, bx = (1 - k) * 360, by = (1 - k) * 260;
    $("lgNavy").setAttribute("transform", `translate(${nx} 0)`);
    $("lgClip").setAttribute("transform", `translate(${nx} 0)`);
    $("lgBlueG").setAttribute("transform", `translate(${bx} ${by})`);
    $("lgAmberG").setAttribute("transform", `translate(${bx} ${by})`);
    const lo = clamp(p(u, d0, d0 + 0.2));
    const endLift = isEnd ? 0 : 0;
    css($("logo"), { opacity: lo, transform: `translateY(${endLift}px) scale(${isEnd ? 1 : 1 + 0.04 * Math.sin(u * 2)})` });
    charsIn($("word"), u, d0 + 0.35, 0.12, 0.32);
    if (isEnd) {
      $("tag").innerHTML = `懂你的<span class="hl" id="tagHl">每一张</span>照片`;
      popEl($("tag"), u, L.ls + 0.55, 0.32);
      popEl($("kin"), u, L.ls + 0.75, 0.3);
      popEl($("plat"), u, L.ls + 1.0, 0.32);
    } else {
      $("tag").innerHTML = `完全<span class="hl" id="tagHl">离线</span>的 AI 相册`;
      popEl($("tag"), u, L.ls + 0.5, 0.32);
      popEl($("kin"), u, L.ls + 0.9, 0.3);
      css($("plat"), { opacity: 0 });
    }
    const hl = eOut(p(u, L.ls + (isEnd ? 1.0 : 0.9), L.ls + (isEnd ? 1.4 : 1.3)));
    $("tagHl").style.backgroundSize = `${hl * 100}% 100%`;
    // fade out logo scene before features
    if (!isEnd) css($("s-logo"), { opacity: 1 - p(t, S.logo.b - 0.12, S.logo.b) });
    else css($("s-logo"), { opacity: 1 });
  }

  if (featOn) {
    // phone rises in, exits down at the end
    const inP = eOut(p(t, S.cleanup.a, S.cleanup.a + 0.5));
    const outP = eIn(p(t, S.end.a, S.end.a + 0.4));
    const f4 = t - S.offline.a;
    const zoom = t >= S.offline.a ? 1 - 0.06 * eOut(p(f4, 0, 0.5)) : 1;
    css($("phone"), { transform: `translateY(${(1 - inP) * 1400 + outP * 1500}px) scale(${zoom})` });
    css($("feat-head"), { opacity: 1 - outP });

    const order = ["cleanup", "overview", "post", "offline"];
    const shots = { cleanup: "sc-cleanup", overview: "sc-overview", post: "sc-post", offline: "sc-home" };
    order.forEach((k, i) => {
      const a = S[k].a, b = S[k].b;
      const enter = i === 0 ? 1 : eIO(p(t, a, a + 0.38));
      const leave = i === order.length - 1 ? 0 : eIO(p(t, b, b + 0.38));
      const vis = t >= a && (t < b + 0.38 || i === order.length - 1);
      const el = $(shots[k]);
      show(el, vis);
      css(el, { transform: `translateX(${(1 - enter) * 610 - leave * 610}px) scale(${610 / 540})` });
      // headline
      const h = FEATS[k].el;
      show(h, t >= a && (t < b || i === order.length - 1));
      if (t >= a) {
        const u = t - a;
        popEl(h.querySelector(".chip"), u, 0.0, 0.28);
        charsIn(h.querySelector(".head"), u, 0.06, 0.05, 0.3);
        h.querySelector(".hl").style.backgroundSize = `${eOut(p(u, 0.35, 0.75)) * 100}% 100%`;
        const sb = eOut(p(u, 0.3, 0.6));
        css(h.querySelector(".sub"), { opacity: sb, transform: `translateY(${(1 - sb) * 30}px)` });
      }
    });

    // cleanup interactions
    {
      const L = S.cleanup, u = t - L.a;
      const tabs = [[278, 60], [32, 76], [386, 78]]; // 废片, 截图, 重复  (x, width)
      const ti = u < L.ls + 0.45 ? 0 : u < L.ls + 0.9 ? 1 : 2;
      const ringOn = u > L.ls - 0.05 && u < L.ls + 1.7;
      css($("tabRing"), { left: tabs[ti][0] + "px", width: tabs[ti][1] + 10 + "px", opacity: ringOn ? 1 : 0 });
      const tapAt = L.ls + 1.7;
      const tp = p(u, tapAt, tapAt + 0.45);
      css($("tap1"), { opacity: tp > 0 && tp < 1 ? 1 - tp : 0, transform: `scale(${0.6 + tp * 1.2})` });
      GONE.forEach((g, i) => {
        const x = eIn(p(u, tapAt + 0.15 + i * 0.05, tapAt + 0.45 + i * 0.05));
        css(g.cell, { transform: `scale(${1 - x})`, opacity: 1 - x });
        g.cover.style.opacity = x > 0 ? 1 : 0;
      });
      const to = eBack(p(u, tapAt + 0.4, tapAt + 0.7));
      css($("toast1"), { opacity: clamp(to), transform: `translateX(-50%) scale(${0.6 + 0.4 * to})` });
    }
    // overview: type a query, filter the grid
    {
      const L = S.overview, u = t - L.a;
      const q = u < L.ls + 0.95 ? "" : u < L.ls + 1.35 ? "猫" : "发票";
      $("typed").textContent = q;
      const caretX = 90 + q.length * 30;
      css($("caret"), { left: caretX + 4 + "px", opacity: Math.floor(u * 3) % 2 ? 0.2 : 1 });
      const match = q === "猫" ? [0, 7] : q === "发票" ? [8] : null;
      CELLS.forEach((c, i) => {
        const hit = match && match.includes(i);
        css(c, { background: match && !hit ? "rgba(250,249,255,.82)" : "transparent", boxShadow: hit ? "inset 0 0 0 5px #F5B942" : "none" });
      });
    }
    // post: tap "regenerate", then the text types itself out line by line
    {
      const L = S.post, u = t - L.a;
      const tp = p(u, L.ls + 0.1, L.ls + 0.5);
      css($("tap3"), { opacity: tp > 0 && tp < 1 ? 1 - tp : 0, transform: `scale(${0.6 + tp * 1.2})` });
      COVERS.forEach((c, i) => {
        const x = p(u, L.ls + 0.45 + i * 0.2, L.ls + 0.65 + i * 0.2);
        c.style.left = 36 + 460 * x + "px";
        c.style.opacity = x >= 1 ? 0 : 1;
      });
    }
    // offline badges
    {
      const L = S.offline, u = t - L.a;
      const on = t >= L.a;
      ["bdg1", "bdg2", "bdg3"].forEach((id, i) => {
        show($(id), on);
        if (on) popEl($(id), u, L.ls + 0.15 + i * 0.4, 0.32, `translateY(${Math.sin(u * 2 + i) * 6 + outP * 1500}px)`);
      });
    }
  }
};

window.ready = Promise.all([
  document.fonts.ready,
  ...[...document.images].map((i) => i.decode()),
  ...["zh-overview.jpg", "zh-cleanup.jpg"].map((f) => { const i = new Image(); i.src = "../assets/screenshots/" + f; return i.decode(); }),
]);
</script>
</body>
</html>
